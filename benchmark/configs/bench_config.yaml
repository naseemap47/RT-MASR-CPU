# benchmark/configs/bench_config.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Benchmark run configuration for ASR CPU evaluation (Qwen3-ASR + Whisper).
# ─────────────────────────────────────────────────────────────────────────────

# Configurations to benchmark. Each entry maps to an engine class + config.
# Optional per-entry key `enabled` (default true): `enabled: false` skips the entry
# in a default run. `--models <id>` still runs it explicitly.
configs:
  - id: "qwen3_onnx_int8_0.6b"
    display_name: "Qwen3-ASR-0.6B INT8 (ONNX / CPU)"
    backend: "onnx"
    model_config: "config/models/qwen3_onnx_0.6b_int8.yaml"

  # ── Fused-encoder ONNX exports (andrewleech/qwen3-asr-*-onnx), FP32 / INT4 ──
  #    Download first: uv run python src/utils/download_utils.py --model <name>
  - id: "qwen3_onnx_fp32_0.6b"
    display_name: "Qwen3-ASR-0.6B FP32 (ONNX / CPU)"
    backend: "onnx"
    model_config: "config/models/qwen3_onnx_0.6b_fp32.yaml"

  - id: "qwen3_onnx_int4_0.6b"
    display_name: "Qwen3-ASR-0.6B INT4 (ONNX / CPU)"
    backend: "onnx"
    model_config: "config/models/qwen3_onnx_0.6b_int4.yaml"

  - id: "qwen3_onnx_fp32_1.7b"           # ~10 GB of weights: needs a lot of RAM, use --runs 1 on small machines
    enabled: false                       # skipped by default; set true (or pass --models qwen3_onnx_fp32_1.7b) to run
    display_name: "Qwen3-ASR-1.7B FP32 (ONNX / CPU)"
    backend: "onnx"
    model_config: "config/models/qwen3_onnx_1.7b_fp32.yaml"

  - id: "qwen3_onnx_int4_1.7b"
    display_name: "Qwen3-ASR-1.7B INT4 (ONNX / CPU)"
    backend: "onnx"
    model_config: "config/models/qwen3_onnx_1.7b_int4.yaml"

  - id: "qwen3_transformers_bf16_0.6b"
    display_name: "Qwen3-ASR-0.6B BF16 (Transformers / CPU)"
    backend: "transformers"
    model_config: "config/models/qwen3_0.6b.yaml"

  - id: "qwen3_transformers_bf16_1.7b"
    display_name: "Qwen3-ASR-1.7B BF16 (Transformers / CPU)"
    backend: "transformers"
    model_config: "config/models/qwen3_1.7b.yaml"

  # ── Whisper ONNX INT8 (all sizes share models/whisper_int8/) ───────────
  - id: "whisper_int8_tiny"
    display_name: "Whisper tiny INT8 (ONNX / CPU)"
    backend: "whisper"
    model_config: "config/models/whisper_int8_tiny.yaml"

  - id: "whisper_int8_base"
    display_name: "Whisper base INT8 (ONNX / CPU)"
    backend: "whisper"
    model_config: "config/models/whisper_int8_base.yaml"

  - id: "whisper_int8_small"
    display_name: "Whisper small INT8 (ONNX / CPU)"
    backend: "whisper"
    model_config: "config/models/whisper_int8_small.yaml"

  - id: "whisper_int8_medium"      # slow on CPU (RTF > 2): use --runs 1 or skip
    display_name: "Whisper medium INT8 (ONNX / CPU)"
    backend: "whisper"
    model_config: "config/models/whisper_int8_medium.yaml"

# Number of inference runs per audio file (first `warmup_runs` are discarded).
runs: 3
warmup_runs: 1

# Concurrency levels to test. One leg = one independently streamed audio source.
concurrency_legs: [1, 2, 4]

# stream: every leg plays its audio into the engine as a live call (chunks arrive at
#         real-time pace, same stream logic as the live server). N legs = N sources
#         streaming at once; the question is "do they all keep up with live speech?".
# batch:  offline capacity test -- N worker threads call transcribe() back to back
#         (legs x concurrency_rounds requests), no real-time pacing.
concurrency_mode: stream

# --- stream mode ---
concurrency_chunk_s: 0.5          # audio per chunk (the browser sends 0.5 s)
concurrency_stagger_s: 0.0        # delay between leg start times; 0 = all calls start together (worst case)
concurrency_lag_threshold_s: 2.0  # a leg "kept up" if p95 staleness and end-of-call lag stay below this

# --- batch mode ---
# Requests per worker at each level (total requests = legs * rounds).
concurrency_rounds: 2

# Fixed workload for the concurrency test: leg i (batch: request i) uses file
# i % len(list), so every level and every config processes the same audio and
# results are comparable. Use several files so legs are not identical streams.
concurrency_audio:
  - "test_audio/en/librispeech_0_1089_0.wav"
  - "test_audio/en/librispeech_1_1089_1.wav"
  - "test_audio/en/librispeech_2_1089_2.wav"

# Audio files for latency and accuracy testing.
audio:
  en:
    - "test_audio/en/librispeech_0_1089_0.wav"
    - "test_audio/en/librispeech_1_1089_1.wav"
    - "test_audio/en/librispeech_2_1089_2.wav"
  zh:
    - "test_audio/cn/OSR_cn_000_0072_8k.wav"
    - "test_audio/cn/OSR_cn_000_0073_8k.wav"
  id:
    - "test_audio/id/ind_001.wav"
    - "test_audio/id/ind_002.wav"

# Output directory for results.
output_dir: "benchmark/results"

# References file for accuracy testing.
references_file: "benchmark/data/references.yaml"
