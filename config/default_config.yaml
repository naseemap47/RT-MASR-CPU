server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

audio:
  sample_rate: 16000
  channels: 1
  sample_width: 2 # 16-bit PCM
  chunk_duration_ms: 200

default_model: "qwen3_asr"
default_pipeline: "streaming_pcm"

telemetry:
  enabled: true
  sampling_interval_sec: 1.0

load_test:
  max_simulated_legs: 1000
  default_test_duration_sec: 10
