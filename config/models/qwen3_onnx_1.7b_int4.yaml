# ──────────────────────────────────────────────────────────────────────────────
# config/models/qwen3_onnx_1.7b_int4.yaml
#
# Qwen3-ASR-1.7B  INT4  —  Pure ONNX Runtime backend (no PyTorch)
#   Engine  : ONNXQwen3ASR  (src/engines/qwen3_onnx_engine.py)
#   HF repo : andrewleech/qwen3-asr-1.7b-onnx
#   Local   : models/qwen3-asr-onnx-1.7b-int4
#   Download: uv run python src/utils/download_utils.py --model qwen3_onnx_1.7b_int4
#
#   Fused layout: one encoder graph + decoder_init / decoder_step graphs.
#   INT4 (RTN, block 64) weights: much smaller download and RAM; small accuracy cost.
# ──────────────────────────────────────────────────────────────────────────────

name: "qwen3_onnx_1.7b_int4"
display_name: "Qwen3-ASR-1.7B INT4 (ONNX / CPU)"
backend: "onnx"                  # → loads src/engines/qwen3_onnx_engine.py :: ONNXQwen3ASR

download:
  repo_id: "andrewleech/qwen3-asr-1.7b-onnx"
  target_dir: "models/qwen3-asr-onnx-1.7b-int4"
  method: "hf_files"             # uses DownloadModels.download_hf_files()
  files:                         # shared files + the int4 weights (sizes are verified)
    - "embed_tokens.bin"         # FP16 embedding table
    - "config.json"
    - "preprocessor_config.json"
    - "tokenizer.json"
    - "tokenizer_config.json"
    - "added_tokens.json"
    - "vocab.json"
    - "encoder.int4.onnx"
    - "decoder_init.int4.onnx"
    - "decoder_step.int4.onnx"
    - "decoder_weights.int4.data"

engine:
  onnx_dir: "models/qwen3-asr-onnx-1.7b-int4"
  num_threads: 0                 # 0 = let ORT use all logical cores; set >0 to cap CPU usage
  quantize: "int4"             # "fp32" | "int4"  (selects the *.int4.onnx graphs)
  language: null                 # null = auto-detect; "English" | "Chinese" | "Indonesian"  (aliases en / zh / mandarin / id also work)

inference:
  max_new_tokens: 512
  chunk_sec: 30                  # seconds per window for silence-split long audio

audio:
  sample_rate: 16000
  n_mels: 128

ort_session:
  graph_optimization_level: "all"   # ORT_ENABLE_ALL — recommended for CPU
  log_severity_level: 3             # 0=verbose … 3=error
  providers:
    - "CPUExecutionProvider"

streaming:
  min_buffer_samples: 8000       # trigger inference after ≥0.5 s buffered
  infer_every_n_chunks: 2        # throttle: run inference every N PCM chunks
