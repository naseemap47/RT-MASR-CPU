# ──────────────────────────────────────────────────────────────────────────────
# config/models/whisper_fp16.yaml
#
# Whisper — ONNX FP16 backend (half-precision, balanced speed/accuracy)
#   Engine  : WhisperOnnxEngine  (src/engines/whisper_engine.py)
#   Source  : PINTO model-zoo, Wasabi S3 (FP16 dynamic-range quantised)
#   Local   : models/whisper_fp16
#   Download: DownloadModels().download_whisper(target_dir="models/whisper_fp16", precision="fp16")
# ──────────────────────────────────────────────────────────────────────────────

name: "whisper_fp16"
display_name: "Whisper FP16 (ONNX / CPU)"
backend: "whisper"               # → loads src/engines/whisper_engine.py :: WhisperOnnxEngine

download:
  method: "whisper"              # uses DownloadModels.download_whisper()
  target_dir: "models/whisper_fp16"
  precision: "fp16"

engine:
  model_name: "medium"           # tiny | base | small | medium  (and *.en variants)
  model_dir: "models/whisper_fp16"
  precision: "fp16"
  num_threads: 0
  language: null
  graph_opt: "all"

inference:
  beam_size: 5
  temperature: 0.0

audio:
  sample_rate: 16000
  chunk_length_sec: 30

ort_session:
  graph_optimization_level: "all"
  log_severity_level: 3
  providers:
    - "CPUExecutionProvider"
