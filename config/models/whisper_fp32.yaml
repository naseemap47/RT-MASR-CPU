# ──────────────────────────────────────────────────────────────────────────────
# config/models/whisper_fp32.yaml
#
# Whisper — ONNX FP32 backend (full-precision, highest accuracy)
#   Engine  : WhisperOnnxEngine  (src/engines/whisper_engine.py)
#   Source  : PINTO model-zoo, Wasabi S3 (FP32 / no post-process)
#   Local   : models/whisper_fp32
#   Download: DownloadModels().download_whisper(target_dir="models/whisper_fp32", precision="fp32")
# ──────────────────────────────────────────────────────────────────────────────

name: "whisper_fp32"
display_name: "Whisper FP32 (ONNX / CPU)"
backend: "whisper"               # → loads src/engines/whisper_engine.py :: WhisperOnnxEngine

download:
  method: "whisper"              # uses DownloadModels.download_whisper()
  target_dir: "models/whisper_fp32"
  precision: "fp32"

engine:
  model_name: "medium"           # tiny | base | small | medium  (and *.en variants)
  model_dir: "models/whisper_fp32"
  precision: "fp32"
  num_threads: 0
  language: null
  graph_opt: "all"

inference:
  beam_size: 5
  temperature: 0.0

audio:
  sample_rate: 16000
  chunk_length_sec: 30

ort_session:
  graph_optimization_level: "all"
  log_severity_level: 3
  providers:
    - "CPUExecutionProvider"
