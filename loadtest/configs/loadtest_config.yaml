# loadtest/configs/loadtest_config.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Load test: simulate many independent real-time call legs on one machine, ramp
# until the machine saturates, and record the data the sizing model needs.
#
# One leg = one independently streamed audio source (one call), played into the
# engine at real-time pace with the live server's stream logic.
# ─────────────────────────────────────────────────────────────────────────────

# Engine definitions (backend, model yaml) are reused from the benchmark config.
bench_config: "benchmark/configs/bench_config.yaml"

# What one simulated call looks like.
call:
  duration_s: 30            # length of each call; long enough to reach steady state
  start_spread_s: 6         # call starts are spread evenly over this window (real calls are not aligned)
  chunk_s: 0.5              # audio per chunk (the browser sends 0.5 s)
  audio:                    # leg i streams audio[i % len]
    - "test_audio/en/librispeech_0_1089_0.wav"
    - "test_audio/en/librispeech_1_1089_1.wav"
    - "test_audio/en/librispeech_2_1089_2.wav"

# Load profiles: how dense the speech is. Silence skips inference, so profile changes the cost of a leg.
#   gap_s = silence appended after every clip (the clips are ~4-7 s of speech).
profiles:
  dense:                    # almost continuous talking: worst-case stress profile (about 85% speech)
    gap_s: 1.0
  conversational:           # roughly half of each call is speech (turn-taking with pauses): planning case
    gap_s: 7.0

# "Healthy" level = every leg keeps up. A leg keeps up if its p95 staleness AND its end-of-call lag stay
# under lag_threshold_s. A leg that falls abort_lag_s behind is stopped (overload guard).
slo:
  lag_threshold_s: 2.0
  abort_lag_s: 8.0

# Ramp: climb this ladder until the first unhealthy level, bisect between the last healthy and the
# first unhealthy level, then re-run the answer to confirm it.
ramp:
  levels: [1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64]
  refine: true
  refine_steps: 4
  confirm: true

# Protect the machine: never let the test use RAM the rest of the system needs.
safety:
  reserve_mb: 1500          # RAM that must remain free for everything else
  hard_floor_mb: 600        # workers are killed if free RAM drops below this mid-level
  assumed_mb_per_leg: 250   # per-leg RSS growth assumed until two levels have been measured

# Models to load-test. Each model is ramped on this whole machine (all logical CPUs, one process).
models:
  - id: "qwen3_onnx_int8_0.6b"
  - id: "whisper_int8_tiny"

output_dir: "loadtest/results"
