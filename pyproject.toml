[project]
name = "rt-masr-cpu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "onnxruntime>=1.30.0",
    "pytest>=9.1.1",
    "soundfile>=0.14.0",
    "tokenizers>=0.22.0",
    "transformers==4.57.6",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
    "psutil>=6.0.0",
    "qwen-asr>=0.0.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
